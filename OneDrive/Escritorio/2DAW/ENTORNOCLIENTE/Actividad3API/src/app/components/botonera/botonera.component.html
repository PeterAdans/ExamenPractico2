<div class="d-flex gap-2">
    @if(parent == 'card'){
    <a [routerLink]="['/user', _id]" class="btn btn-secondary"> Ver detalle</a>
    }@else if(parent == 'view'){
    <a [routerLink]="['/users']" class="btn btn-secondary"> Volver al listado</a>
    }
    <a [routerLink]="['/updateuser', _id]" class="btn btn-warning">Actualizar</a>
    <button type="button" class="btn btn-danger" (click)="borrarUsers(_id)">Borrar</button>
</div>
